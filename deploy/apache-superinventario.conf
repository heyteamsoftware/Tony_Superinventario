    # --- Tony_Superinventario: app Node.js en 127.0.0.1:3100 (servicio tony-superinventario) ---
    # Pegar dentro del <VirtualHost *:443> de /etc/apache2/sites-available/000-default-le-ssl.conf
    RedirectMatch 301 ^/Tony_Superinventario$ /Tony_Superinventario/
    ProxyPass        /Tony_Superinventario/ http://127.0.0.1:3100/
    ProxyPassReverse /Tony_Superinventario/ http://127.0.0.1:3100/
    # El código nunca se sirve como fichero estático, solo a través del proxy.
    <Directory /var/www/html/Tony_Superinventario>
        Require all denied
    </Directory>
