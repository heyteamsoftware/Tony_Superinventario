<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Superinventario · CIFP Tony Gallardo</title>
  <meta name="description" content="Inventario del CIFP Tony Gallardo por aulas y familias profesionales">
  <meta name="theme-color" content="#121629">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="icon" href="img/icono-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="#/plano" aria-label="Superinventario del CIFP Tony Gallardo, ir al plano">
      <img class="logo-centro" src="img/logo-cifp.webp" alt="" width="40" height="40">
      <span class="marca-texto">
        <span class="marca-nombre">Super<b>inventario</b></span>
        <span class="marca-centro">CIFP Tony Gallardo</span>
      </span>
    </a>
    <nav class="nav" aria-label="Secciones">
      <a href="#/plano" data-seccion="plano">Plano</a>
      <a href="#/inventario" data-seccion="inventario">Inventario</a>
      <a href="#/familias" data-seccion="familias">Familias <span class="nav-aviso" id="nav-avisos" hidden></span></a>
      <a href="#/revisiones" data-seccion="revisiones">Revisiones</a>
      <a href="#/historial" data-seccion="historial">Historial</a>
      <a href="#/datos" data-seccion="datos">Datos</a>
    </nav>
    <form class="busqueda-global" role="search" id="busqueda-global">
      <input type="search" name="q" placeholder="Buscar material, código, nº de serie…" aria-label="Buscar en todo el inventario">
    </form>
    <button class="usuario" id="boton-usuario" type="button" title="Cambiar de usuario"></button>
    <span class="visitantes" id="visitantes" role="status" title="Visitantes únicos" aria-label="Visitantes únicos">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <b id="visitantes-n">–</b>
    </span>
  </header>
  <main id="vista" tabindex="-1"></main>
  <div id="avisos" class="toasts" aria-live="polite"></div>
</body>
</html>
