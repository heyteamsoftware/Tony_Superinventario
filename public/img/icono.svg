    <circle cx="32" cy="29" r="16" fill="#dde2e9"/>
    <!-- Caja -->
    <path d="M32 9.5 46 17.2 32 25 18 17.2Z" fill="#cf6476"/>
    <path d="M18 17.2 32 25v19L18 36.4Z" fill="#a3243a"/>
    <path d="M46 17.2 32 25v19l14-7.6Z" fill="#7b1427"/>
    <path d="M25 13.4 39 21.1" stroke="#f6d3d9" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M21.3 27.6l3.4 3.7 5-6.9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mar -->
